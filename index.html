<!DOCTYPE html>
<html>
  <head>
    <title>Interesting Website</title>
    <style>
      #buton {
        color: navy;
        position: relative;
        right: 50px;
      }
    </style>
  </head>
  <body>
    <h1>Click the button...</h1>
    <button type="button" id="buton" onmouseover="onPresed()"></button>
    <script>
      let button = document.getElementById("buton");
      let i = 1;
      function onPresed() {
        if(i == 0) {
          button.style.right = "50px";
          i = 1;
        } else {
          button.style.right = "0px";
          i = 0;
        }
      }
    </script>
  </body>
</html>
